<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>薔琵颱風知識小測驗</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti Effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 颱風氣旋背景動效 */
        .typhoon-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 140vw;
            height: 140vw;
            max-width: 1500px;
            max-height: 1500px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(14, 165, 233, 0.14) 0%, rgba(99, 102, 241, 0.07) 45%, rgba(3, 7, 18, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: rotateCyclone 50s linear infinite;
        }

        @keyframes rotateCyclone {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* 雷達光暈脈衝 */
        .radar-pulse {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 50%;
            animation: pulseWave 8s linear infinite;
            pointer-events: none;
        }
        .radar-pulse:nth-child(2) { animation-delay: 2.5s; }
        .radar-pulse:nth-child(3) { animation-delay: 5s; }

        @keyframes pulseWave {
            0% { width: 80px; height: 80px; opacity: 0.8; }
            100% { width: 800px; height: 800px; opacity: 0; }
        }

        /* 卡片切換淡入動畫 */
        .card-enter {
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* 選項 hover 效果 */
        .option-btn {
            transition: all 0.2s ease;
        }
        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: #38bdf8;
            box-shadow: 0 4px 20px -2px rgba(56, 189, 248, 0.25);
        }
    </style>
</head>
<body class="relative flex flex-col min-h-screen justify-between selection:bg-cyan-500 selection:text-white">

    <!-- 動態氣旋與雷達背景 -->
    <div class="typhoon-bg"></div>
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="radar-pulse"></div>
        <div class="radar-pulse"></div>
        <div class="radar-pulse"></div>
    </div>
    <div class="fixed inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900/60 via-slate-950/90 to-black pointer-events-none z-0"></div>

    <!-- 主體內容容器 -->
    <main class="relative z-10 container mx-auto px-4 py-8 max-w-2xl flex-1 flex flex-col justify-center items-center">
        
        <!-- 頂部頁首 -->
        <header class="text-center mb-6 w-full">
            <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-xs font-semibold mb-3 tracking-wider backdrop-blur-md">
                <i class="fa-solid fa-cloud-bolt animate-bounce"></i> 氣象科普與即時動態小挑戰
            </div>
            <h1 class="text-3xl md:text-4xl font-black tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-sky-200 to-indigo-300 drop-shadow-md">
                薔琵颱風知識小測驗
            </h1>
            <p class="text-slate-400 text-xs md:text-sm mt-1.5">
                結合 10/23 最新颱風假資訊、颱風命名由來與古城國小上課情境！
            </p>
        </header>

        <!-- 快訊提示標籤 (台東轉彎資訊) -->
        <div class="w-full mb-4 bg-amber-500/10 border border-amber-500/30 rounded-2xl p-3 flex items-center gap-3 backdrop-blur-md text-amber-300 text-xs md:text-sm">
            <i class="fa-solid fa-triangle-exclamation text-amber-400 text-lg shrink-0"></i>
            <div>
                <span class="font-bold">最新快訊：</span>台東縣大轉彎宣布全縣停班停課，全臺僅剩<span class="font-extrabold underline text-white">金門縣</span>正常上班上課！
            </div>
        </div>

        <!-- 遊戲主卡片區 -->
        <div id="quiz-card" class="w-full bg-slate-900/80 border border-slate-800 backdrop-blur-xl rounded-3xl p-6 md:p-8 shadow-2xl relative overflow-hidden transition-all duration-300">
            
            <!-- 頂部進度與分數面板 -->
            <div id="quiz-header" class="mb-6 flex flex-col gap-2">
                <div class="flex justify-between items-center text-xs font-bold text-slate-400">
                    <span id="question-progress-text" class="text-cyan-400">題目 1 / 5</span>
                    <span id="score-text" class="text-amber-400"><i class="fa-solid fa-star mr-1"></i>目前得分：0</span>
                </div>
                <!-- 進度條 -->
                <div class="w-full bg-slate-950 rounded-full h-2.5 overflow-hidden border border-slate-800">
                    <div id="progress-bar" class="bg-gradient-to-r from-cyan-500 to-indigo-500 h-2.5 rounded-full transition-all duration-500 w-1/5"></div>
                </div>
            </div>

            <!-- 題目與選項區域 -->
            <div id="question-container" class="card-enter">
                <!-- 題目標題 -->
                <div class="mb-6 flex items-start gap-3">
                    <span id="question-badge" class="bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 text-xs font-bold px-2.5 py-1 rounded-lg shrink-0 mt-0.5">Q1</span>
                    <h2 id="question-text" class="text-lg md:text-xl font-bold text-slate-100 leading-snug">
                        題目加載中...
                    </h2>
                </div>

                <!-- 3個選項按鈕區域 (無中間插圖) -->
                <div id="options-container" class="grid grid-cols-1 gap-3">
                    <!-- JavaScript 動態生成 3 個選項按鈕 -->
                </div>

                <!-- 答題解析與知識解說卡片 -->
                <div id="explanation-box" class="hidden mt-6 p-4 rounded-2xl border text-sm leading-relaxed transition-all">
                    <div class="flex items-center gap-2 font-bold mb-1.5" id="explanation-title">
                        <i class="fa-solid fa-lightbulb"></i> 知識小解說
                    </div>
                    <p id="explanation-text" class="text-slate-300 text-xs md:text-sm"></p>
                </div>

                <!-- 下一題 / 看結果按鈕 -->
                <div class="mt-6 flex justify-end">
                    <button id="next-btn" class="hidden px-6 py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold rounded-xl text-sm shadow-lg shadow-cyan-500/20 transition-all flex items-center gap-2">
                        <span>下一題</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>

            <!-- 結算成績單區域 -->
            <div id="result-container" class="hidden text-center py-4 card-enter">
                <div id="result-badge-icon" class="w-20 h-20 rounded-3xl mx-auto flex items-center justify-center text-4xl shadow-xl mb-4 bg-amber-500/20 text-amber-400 border border-amber-500/40">
                    <i class="fa-solid fa-trophy"></i>
                </div>
                
                <h3 id="result-title" class="text-2xl md:text-3xl font-black text-white mb-2">測驗完成！</h3>
                <p id="result-subtitle" class="text-slate-400 text-xs md:text-sm mb-6">太棒了！你獲得了專屬認證徽章</p>

                <!-- 分數大字樣 -->
                <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-6 mb-6 max-w-sm mx-auto shadow-inner">
                    <span class="text-xs text-slate-400 uppercase tracking-widest font-bold block mb-1">最終得分</span>
                    <span id="final-score" class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 to-yellow-500">100</span>
                    <span class="text-slate-500 text-sm font-bold"> / 100 分</span>
                </div>

                <!-- 評語 -->
                <div class="bg-cyan-950/30 border border-cyan-500/30 rounded-2xl p-4 mb-6 max-w-md mx-auto text-cyan-200 text-sm font-medium">
                    <i class="fa-solid fa-award text-cyan-400 mr-2"></i>
                    <span id="result-comment">認證評語計算中...</span>
                </div>

                <!-- 重新測驗按鈕 -->
                <button onclick="restartQuiz()" class="px-8 py-3.5 bg-gradient-to-r from-cyan-500 via-sky-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white font-black rounded-2xl text-base shadow-xl shadow-cyan-500/25 transition-all transform hover:-translate-y-0.5 inline-flex items-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span>再測驗一次</span>
                </button>
            </div>

        </div>

    </main>

    <!-- 頁尾 -->
    <footer class="relative z-10 border-t border-slate-800/80 bg-slate-950/90 backdrop-blur-md py-4 text-center text-xs text-slate-500">
        <p>薔琵颱風知識小測驗 &copy; 氣象知識科普小組製作</p>
    </footer>

    <script>
        // 最新題庫資料 (嚴格固定每題 3 個選項 A, B, C，更新台東全縣停班課邏輯)
        const quizData = [
            {
                id: 1,
                question: "薔琵（Champi）代表什麼意思？",
                options: [
                    { letter: "A", text: "黃樟花／帶有香味的花朵", isCorrect: true },
                    { letter: "B", text: "強烈氣旋", isCorrect: false },
                    { letter: "C", text: "颱風女神", isCorrect: false }
                ],
                explanation: "答對了！「薔琵（Champi）」代表一種帶有獨特香氣的花朵（例如黃樟花或黃玉蘭意象）。"
            },
            {
                id: 2,
                question: "薔琵颱風是由哪一個國家/地區命名的？",
                options: [
                    { letter: "A", text: "日本", isCorrect: false },
                    { letter: "B", text: "柬埔寨", isCorrect: true },
                    { letter: "C", text: "臺灣", isCorrect: false }
                ],
                explanation: "沒錯！「薔琵」這個名字是由柬埔寨所提供，是西北太平洋颱風命名表中的一員。"
            },
            {
                id: 3,
                question: "薔琵（Champi）這種花朵有什麼特徵？",
                options: [
                    { letter: "A", text: "亮黃色且帶有強烈芳香", isCorrect: true },
                    { letter: "B", text: "巨大的紅色無香花", isCorrect: false },
                    { letter: "C", text: "深藍色的水生花卉", isCorrect: false }
                ],
                explanation: "太棒了！薔琵花通常呈現亮黃色或白色，氣味非常芳香典雅。"
            },
            {
                id: 4,
                question: "根據 10/23 最新颱風假名單（含台東大轉彎宣布停班課），全臺灣唯一「沒有放颱風假」正常上班課的縣市是？",
                options: [
                    { letter: "A", text: "澎湖縣", isCorrect: false },
                    { letter: "B", text: "屏東縣", isCorrect: false },
                    { letter: "C", text: "金門縣", isCorrect: true }
                ],
                explanation: "答對了！雖然台東縣今晨大轉彎宣布全縣停班停課，但金門縣依然維持「正常上班上課」，成為全臺唯一正常上班課的縣市！"
            },
            {
                id: 5,
                question: "金門縣古城國小的小朋友，10/23（星期五）需要去學校上課嗎？",
                options: [
                    { letter: "A", text: "需要去上課", isCorrect: true },
                    { letter: "B", text: "不需要上學", isCorrect: false },
                    { letter: "C", text: "當天放颱風假", isCorrect: false }
                ],
                explanation: "沒錯！因為金門縣 10/23 公告「正常上班上課」，所以古城國小的小朋友星期五當天依然要準時去學校快樂學習喔！"
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        // Web Audio API 音效
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3); // A5
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime); // A3
                osc.frequency.exponentialRampToValueAtTime(130.81, audioCtx.currentTime + 0.3); // C3
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // 紙屑慶祝特效
        function fireConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 50,
                    spread: 65,
                    origin: { y: 0.7 },
                    colors: ['#38bdf8', '#fbbf24', '#f43f5e', '#a855f7']
                });
            }
        }

        // 載入當前題目
        function loadQuestion() {
            answered = false;
            const currentQ = quizData[currentQuestionIndex];

            // 更新 UI 進度
            document.getElementById('question-progress-text').textContent = `題目 ${currentQuestionIndex + 1} / ${quizData.length}`;
            document.getElementById('score-text').innerHTML = `<i class="fa-solid fa-star mr-1"></i>目前得分：${score}`;
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex + 1) / quizData.length) * 100}%`;

            // 更新題目文字
            document.getElementById('question-badge').textContent = `Q${currentQuestionIndex + 1}`;
            document.getElementById('question-text').textContent = currentQ.question;

            // 隱藏解說與下一題按鈕
            document.getElementById('explanation-box').className = 'hidden mt-6 p-4 rounded-2xl border text-sm leading-relaxed transition-all';
            document.getElementById('next-btn').classList.add('hidden');

            // 渲染 3 個選項按鈕
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            currentQ.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full p-4 rounded-2xl bg-slate-950/70 border border-slate-800 text-left flex items-center justify-between gap-3 text-slate-200 text-sm font-medium transition-all group`;
                btn.onclick = () => selectOption(idx);
                
                btn.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-8 h-8 rounded-xl bg-slate-800 group-hover:bg-cyan-500/20 group-hover:text-cyan-300 border border-slate-700 text-slate-400 font-bold text-xs flex items-center justify-center shrink-0 transition-colors">
                            ${opt.letter}
                        </span>
                        <span>${opt.text}</span>
                    </div>
                    <i class="fa-regular fa-circle text-slate-600 text-lg group-hover:text-cyan-400 transition-colors status-icon"></i>
                `;
                optionsContainer.appendChild(btn);
            });

            // 觸發卡片淡入動畫
            const qContainer = document.getElementById('question-container');
            qContainer.classList.remove('card-enter');
            void qContainer.offsetWidth; // 重繪觸發
            qContainer.classList.add('card-enter');
        }

        // 選擇答案
        function selectOption(index) {
            if (answered) return;
            answered = true;

            const currentQ = quizData[currentQuestionIndex];
            const optionBtns = document.querySelectorAll('.option-btn');
            const selectedOpt = currentQ.options[index];

            optionBtns.forEach(btn => btn.disabled = true);

            const expBox = document.getElementById('explanation-box');
            const expTitle = document.getElementById('explanation-title');
            const expText = document.getElementById('explanation-text');

            if (selectedOpt.isCorrect) {
                // 答對
                score += 20;
                playSound('correct');
                fireConfetti();

                const btn = optionBtns[index];
                btn.className = 'option-btn w-full p-4 rounded-2xl bg-emerald-950/60 border-2 border-emerald-500 text-left flex items-center justify-between gap-3 text-emerald-200 text-sm font-bold shadow-lg shadow-emerald-950/50';
                btn.querySelector('.status-icon').className = 'fa-solid fa-circle-check text-emerald-400 text-xl';

                expBox.className = 'mt-6 p-4 rounded-2xl border bg-emerald-950/40 border-emerald-500/40 text-emerald-200 text-xs md:text-sm leading-relaxed block card-enter';
                expTitle.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> 答對了！`;
            } else {
                // 答錯
                playSound('wrong');

                const btn = optionBtns[index];
                btn.className = 'option-btn w-full p-4 rounded-2xl bg-rose-950/60 border-2 border-rose-500 text-left flex items-center justify-between gap-3 text-rose-200 text-sm font-bold shadow-lg shadow-rose-950/50';
                btn.querySelector('.status-icon').className = 'fa-solid fa-circle-xmark text-rose-400 text-xl';

                // 高亮正確答案
                currentQ.options.forEach((opt, idx) => {
                    if (opt.isCorrect) {
                        const correctBtn = optionBtns[idx];
                        correctBtn.className = 'option-btn w-full p-4 rounded-2xl bg-emerald-950/40 border border-emerald-500/50 text-left flex items-center justify-between gap-3 text-emerald-300 text-sm font-medium';
                        correctBtn.querySelector('.status-icon').className = 'fa-solid fa-circle-check text-emerald-400 text-lg';
                    }
                });

                expBox.className = 'mt-6 p-4 rounded-2xl border bg-rose-950/40 border-rose-500/40 text-rose-200 text-xs md:text-sm leading-relaxed block card-enter';
                expTitle.innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-400"></i> 答錯囉！`;
            }

            expText.textContent = currentQ.explanation;
            document.getElementById('score-text').innerHTML = `<i class="fa-solid fa-star mr-1"></i>目前得分：${score}`;

            // 顯示下一步按鈕
            const nextBtn = document.getElementById('next-btn');
            nextBtn.classList.remove('hidden');
            if (currentQuestionIndex === quizData.length - 1) {
                nextBtn.querySelector('span').textContent = '查看最後成績';
            } else {
                nextBtn.querySelector('span').textContent = '下一題';
            }
        }

        // 點擊下一題
        document.getElementById('next-btn').addEventListener('click', () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        });

        // 顯示成績單
        function showResult() {
            document.getElementById('quiz-header').classList.add('hidden');
            document.getElementById('question-container').classList.add('hidden');

            const resultContainer = document.getElementById('result-container');
            resultContainer.classList.remove('hidden');

            document.getElementById('final-score').textContent = score;

            const badgeIcon = document.getElementById('result-badge-icon');
            const comment = document.getElementById('result-comment');

            if (score === 100) {
                badgeIcon.className = 'w-20 h-20 rounded-3xl mx-auto flex items-center justify-center text-4xl shadow-xl mb-4 bg-amber-500/20 text-amber-400 border border-amber-500/40 shadow-amber-500/20';
                badgeIcon.innerHTML = `<i class="fa-solid fa-crown"></i>`;
                comment.textContent = '恭喜 100 分滿分！獲得認證徽章：「金門古城國小智慧小達人」＆「颱風新聞氣象通」！';
                fireConfetti();
            } else if (score >= 60) {
                badgeIcon.className = 'w-20 h-20 rounded-3xl mx-auto flex items-center justify-center text-4xl shadow-xl mb-4 bg-cyan-500/20 text-cyan-400 border border-cyan-500/40 shadow-cyan-500/20';
                badgeIcon.innerHTML = `<i class="fa-solid fa-medal"></i>`;
                comment.textContent = '太讚了！您對薔琵颱風與 10/23 最新颱風假資訊有很深刻的了解！';
            } else {
                badgeIcon.className = 'w-20 h-20 rounded-3xl mx-auto flex items-center justify-center text-4xl shadow-xl mb-4 bg-indigo-500/20 text-indigo-400 border border-indigo-500/40 shadow-indigo-500/20';
                badgeIcon.innerHTML = `<i class="fa-solid fa-book-open"></i>`;
                comment.textContent = '加油！記得台東縣已大轉彎宣布停班停課，全臺僅剩金門縣正常上班課喔！';
            }
        }

        // 重新測驗
        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;

            document.getElementById('result-container').classList.add('hidden');
            document.getElementById('quiz-header').classList.remove('hidden');
            document.getElementById('question-container').classList.remove('hidden');

            loadQuestion();
        }

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            loadQuestion();
        });
    </script>
</body>
</html>
