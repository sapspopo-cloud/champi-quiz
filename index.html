<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>薔琵颱風即時知識測驗 - 古城國小</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-dark: #0a1128;
            --card-bg: #1c2541;
            --accent-blue: #48cae4;
            --accent-gold: #ffb703;
            --success-green: #38b000;
            --danger-red: #ff4d6d;
            --text-light: #f8f9fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            max-width: 700px;
            width: 100%;
        }

        .school-badge {
            display: inline-block;
            background: rgba(72, 202, 228, 0.15);
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--accent-blue);
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #90e0ef;
            margin-bottom: 12px;
        }

        .news-flash {
            background: rgba(255, 183, 3, 0.15);
            border: 1px solid var(--accent-gold);
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 0.85rem;
            color: #ffe6a7;
            display: inline-block;
        }

        .quiz-container {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .progress-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--accent-gold);
            font-weight: bold;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .question-title {
            font-size: 1.2rem;
            margin-bottom: 20px;
            line-height: 1.5;
            color: var(--text-light);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-light);
            padding: 14px 18px;
            border-radius: 10px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(72, 202, 228, 0.2);
            border-color: var(--accent-blue);
        }

        .option-btn.correct {
            background: rgba(56, 176, 0, 0.3);
            border-color: var(--success-green);
            color: #d8f3dc;
            font-weight: bold;
        }

        .option-btn.incorrect {
            background: rgba(255, 77, 109, 0.3);
            border-color: var(--danger-red);
            color: #ffccd5;
        }

        .feedback-box {
            background: rgba(0, 0, 0, 0.3);
            border-left: 4px solid var(--accent-blue);
            padding: 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            line-height: 1.5;
            display: none;
        }

        .feedback-box.active {
            display: block;
        }

        .next-btn {
            background: var(--accent-blue);
            color: var(--bg-dark);
            border: none;
            padding
